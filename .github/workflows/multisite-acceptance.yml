name: Multisite acceptance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    name: Build verified package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        run: bash scripts/build-package.sh 0.1.0-ci

      - name: Verify package
        run: bash tests/package-verification.sh dist/rushleigh-cookie-choices-0.1.0-ci.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: uccm-multisite-package
          path: dist/rushleigh-cookie-choices-0.1.0-ci.zip
          if-no-files-found: error
          retention-days: 7

  topology:
    name: WordPress 6.8 / ${{ matrix.topology }}
    runs-on: ubuntu-latest
    needs:
      - package
    strategy:
      fail-fast: false
      matrix:
        topology:
          - subdirectory
          - subdomain
          - domain-mapped

    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: uccm-multisite-package
          path: dist

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: mysqli
          tools: wp-cli

      - name: Run Multisite package acceptance
        run: bash tests/multisite-package-acceptance.sh dist/rushleigh-cookie-choices-0.1.0-ci.zip "${{ matrix.topology }}"
