name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-checks:
    name: Release checks and signed package
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: sodium

      - name: Validate tag and plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          header_version="$(sed -n 's/^ \* Version:[[:space:]]*//p' rushleigh-cookie-choices.php)"
          constant_version="$(sed -n "s/^define( 'UCCM_VERSION', '\([^']*\)' );$/\1/p" rushleigh-cookie-choices.php)"
          test "${version}" = "${header_version}"
          test "${version}" = "${constant_version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build deterministic plugin archive
        run: bash scripts/build-package.sh "${{ steps.version.outputs.version }}"

      - name: Release check - verify clean installable archive
        env:
          UCCM_MANIFEST_PRIVATE_KEY: ${{ secrets.UCCM_MANIFEST_PRIVATE_KEY }}
        run: bash scripts/verify-package.sh "dist/rushleigh-cookie-choices-${{ steps.version.outputs.version }}.zip"

      - name: Release check - create signed update manifest
        env:
          UCCM_MANIFEST_PRIVATE_KEY: ${{ secrets.UCCM_MANIFEST_PRIVATE_KEY }}
          UCCM_ROLLOUT_PERCENTAGE: ${{ vars.UCCM_ROLLOUT_PERCENTAGE }}
          UCCM_ROLLOUT_SEED: ${{ github.ref_name }}
        run: |
          version="${{ steps.version.outputs.version }}"
          package_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/rushleigh-cookie-choices-${version}.zip"
          checksum="$(cut -d ' ' -f 1 dist/SHA256SUMS)"
          php scripts/create-manifest.php "${version}" "${package_url}" "${checksum}" dist/update-manifest.json

      - name: Release check - publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist/rushleigh-cookie-choices-${version}.zip" \
            "dist/SHA256SUMS" \
            "dist/update-manifest.json" \
            --verify-tag \
            --generate-notes \
            --title "Rushleigh Cookie Choices ${version}"
