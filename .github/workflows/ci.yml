name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        run: composer lint

      - name: Check browser script syntax
        run: |
          node --check assets/js/consent.js
          node --check assets/js/blocker.js

      - name: Run unit tests
        run: composer test

      - name: Smoke-test production package
        if: matrix.php == '8.2'
        shell: bash
        run: |
          bash scripts/build-package.sh 0.1.0-ci
          unzip -t dist/uk-cookie-consent-manager-0.1.0-ci.zip
          unzip -l dist/uk-cookie-consent-manager-0.1.0-ci.zip > dist/archive-contents.txt
          if grep -E '/(tests|vendor|\.github|scripts)/|composer\.(json|lock)|php(unit|stan)|phpcs' dist/archive-contents.txt; then
            exit 1
          fi

      - name: Check WordPress coding standards
        run: composer phpcs

      - name: Run static analysis
        run: composer phpstan
