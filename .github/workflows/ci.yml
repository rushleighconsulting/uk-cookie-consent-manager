name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  translations:
    name: Translation template and JavaScript i18n
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: wp-cli

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate translation template for inspection
        if: always()
        run: bash scripts/generate-pot.sh "${RUNNER_TEMP}/uk-cookie-consent-manager.pot"

      - name: Upload generated translation template
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uccm-generated-pot
          path: ${{ runner.temp }}/uk-cookie-consent-manager.pot
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed translations
        run: bash scripts/check-translations.sh

  source-quality:
    name: Source quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        run: composer lint

      - name: Check browser script syntax
        run: |
          node --check assets/js/consent.js
          node --check assets/js/blocker.js
          node --check assets/js/admin-banner.js
          node --check assets/js/admin-privacy.js
          node --check assets/js/scan-progress.js
          node --check assets/js/scan-runner.js
          node --check playwright.config.js
          node --check tests/browser/admin-privacy.spec.js
          node --check tests/browser/admin-banner.spec.js
          node --check tests/browser/consent.spec.js
          node --check tests/browser/scan-progress.spec.js
          node --check tests/browser/scan-runner.spec.js

      - name: Check WordPress coding standards
        run: composer phpcs

      - name: Run static analysis
        run: composer phpstan

  unit-integration:
    name: Unit and integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit and integration tests
        run: composer test

  browser-consent:
    name: Browser consent (desktop and mobile)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser test tools
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run consent and operational scanner browser flows
        run: npm run test:browser

  package-build:
    name: Package checks
    runs-on: ubuntu-latest
    needs:
      - translations
      - source-quality
      - unit-integration
      - browser-consent

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        run: bash scripts/build-package.sh 0.1.0-ci

      - name: Verify clean archive and credential regression cases
        run: bash tests/package-verification.sh "dist/uk-cookie-consent-manager-0.1.0-ci.zip"

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: uccm-ci-package
          path: dist/uk-cookie-consent-manager-0.1.0-ci.zip
          if-no-files-found: error
          retention-days: 7

  package-install:
    name: Package install (WordPress ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs:
      - package-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: "6.8"
            php: "8.2"
          - wordpress: "6.8"
            php: "8.3"
          - wordpress: "6.9"
            php: "8.4"
          - wordpress: "7.0"
            php: "8.5"

    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: uccm-ci-package
          path: dist

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli
          tools: wp-cli

      - name: Install WordPress
        shell: bash
        run: |
          set -euo pipefail
          wp core download --version="${{ matrix.wordpress }}" --path="${RUNNER_TEMP}/wordpress" --force
          wp config create --path="${RUNNER_TEMP}/wordpress" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          wp core install --path="${RUNNER_TEMP}/wordpress" --url=https://example.test --title=UCCM --admin_user=admin --admin_password=test-password --admin_email=admin@example.test --skip-email

      - name: Install and activate packaged plugin
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/uk-cookie-consent-manager-0.1.0-ci.zip"
          expected_version="$(unzip -p "${archive}" uk-cookie-consent-manager/uk-cookie-consent-manager.php | sed -n 's/^ \* Version:[[:space:]]*//p')"
          test -n "${expected_version}"
          unzip -q "${archive}" -d "${RUNNER_TEMP}/wordpress/wp-content/plugins"
          wp plugin activate uk-cookie-consent-manager --path="${RUNNER_TEMP}/wordpress"
          wp plugin status uk-cookie-consent-manager --path="${RUNNER_TEMP}/wordpress"
          test "$(wp eval 'echo defined( "UCCM_VERSION" ) ? UCCM_VERSION : "";' --path="${RUNNER_TEMP}/wordpress")" = "${expected_version}"

      - name: Verify scheduled operating jobs
        shell: bash
        run: |
          set -euo pipefail
          wp cron event list --path="${RUNNER_TEMP}/wordpress" --fields=hook --format=csv > "${RUNNER_TEMP}/cron.csv"
          grep -q '^uccm_monthly_scan$' "${RUNNER_TEMP}/cron.csv"
          grep -q '^uccm_retention_cleanup$' "${RUNNER_TEMP}/cron.csv"

  package-multisite-install:
    name: Package install (WordPress 6.8 Multisite, PHP 8.2)
    runs-on: ubuntu-latest
    needs:
      - package-build

    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: uccm-ci-package
          path: dist

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: mysqli
          tools: wp-cli

      - name: Install WordPress Multisite and network-activate package
        shell: bash
        run: |
          set -euo pipefail
          wp core download --version="6.8" --path="${RUNNER_TEMP}/wordpress" --force
          wp config create --path="${RUNNER_TEMP}/wordpress" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          wp core install --path="${RUNNER_TEMP}/wordpress" --url=https://example.test --title=UCCM --admin_user=admin --admin_password=test-password --admin_email=admin@example.test --skip-email
          wp core multisite-convert --path="${RUNNER_TEMP}/wordpress" --title=UCCM
          unzip -q dist/uk-cookie-consent-manager-0.1.0-ci.zip -d "${RUNNER_TEMP}/wordpress/wp-content/plugins"
          wp plugin activate uk-cookie-consent-manager --network --path="${RUNNER_TEMP}/wordpress"
          wp plugin is-active uk-cookie-consent-manager --network --path="${RUNNER_TEMP}/wordpress"
          wp site create --path="${RUNNER_TEMP}/wordpress" --slug=second --title=Second --email=second@example.test

      - name: Verify per-site schema, jobs, isolation and network precedence
        shell: bash
        run: |
          set -euo pipefail
          wp db query "SHOW TABLES LIKE 'wp_uccm_consents';" --skip-column-names --path="${RUNNER_TEMP}/wordpress" | grep -q '^wp_uccm_consents$'
          wp db query "SHOW TABLES LIKE 'wp_2_uccm_consents';" --skip-column-names --path="${RUNNER_TEMP}/wordpress" | grep -q '^wp_2_uccm_consents$'
          wp cron event list --url=https://example.test --path="${RUNNER_TEMP}/wordpress" --fields=hook --format=csv > "${RUNNER_TEMP}/main-cron.csv"
          wp cron event list --url=https://example.test/second --path="${RUNNER_TEMP}/wordpress" --fields=hook --format=csv > "${RUNNER_TEMP}/second-cron.csv"
          grep -q '^uccm_monthly_scan$' "${RUNNER_TEMP}/main-cron.csv"
          grep -q '^uccm_retention_cleanup$' "${RUNNER_TEMP}/main-cron.csv"
          grep -q '^uccm_monthly_scan$' "${RUNNER_TEMP}/second-cron.csv"
          grep -q '^uccm_retention_cleanup$' "${RUNNER_TEMP}/second-cron.csv"
          wp eval '
          update_site_option(
              \UCCM\Multisite::SETTINGS_OPTION,
              array(
                  "defaults" => array( "consent_lifetime_days" => 240, "retention_days" => 450 ),
                  "locked"   => array( "retention_days" ),
              )
          );
          switch_to_blog( 1 );
          $main_settings = get_option( \UCCM\Settings::OPTION_NAME, array() );
          $main_settings["consent_policy_version"] = "main-policy";
          $main_settings["retention_days"] = 900;
          update_option( \UCCM\Settings::OPTION_NAME, $main_settings, false );
          update_option( \UCCM\Settings::OVERRIDES_OPTION, array( "retention_days" ), false );
          $main_effective = \UCCM\Settings::current();
          $main_table = \UCCM\Database::table_names()["consents"];
          restore_current_blog();
          switch_to_blog( 2 );
          $second_settings = get_option( \UCCM\Settings::OPTION_NAME, array() );
          $second_settings["consent_policy_version"] = "second-policy";
          update_option( \UCCM\Settings::OPTION_NAME, $second_settings, false );
          $second_effective = \UCCM\Settings::current();
          $second_table = \UCCM\Database::table_names()["consents"];
          restore_current_blog();
          if ( 450 !== $main_effective["retention_days"] || 450 !== $second_effective["retention_days"] ) {
              throw new \RuntimeException( "The locked network retention value was not enforced." );
          }
          if ( "main-policy" !== $main_effective["consent_policy_version"] || "second-policy" !== $second_effective["consent_policy_version"] ) {
              throw new \RuntimeException( "Site policy versions were not isolated." );
          }
          if ( $main_table === $second_table || "wp_uccm_consents" !== $main_table || "wp_2_uccm_consents" !== $second_table ) {
              throw new \RuntimeException( "Site table prefixes were not isolated." );
          }
          if ( true === (bool) get_site_option( \UCCM\Multisite::DELETE_OPTION, false ) ) {
              throw new \RuntimeException( "Network-wide deletion was enabled by default." );
          }
          ' --path="${RUNNER_TEMP}/wordpress"

  wordpress-org-package:
    name: WordPress.org package and Plugin Check
    runs-on: ubuntu-latest
    needs:
      - package-build

    steps:
      - name: Check out source with release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build directory-safe package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ \* Version:[[:space:]]*//p' uk-cookie-consent-manager.php)"
          bash scripts/build-wordpress-org-package.sh "${version}"
          bash scripts/verify-wordpress-org-package.sh dist/wordpress-org/uk-cookie-consent-manager
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/wordpress-org/uk-cookie-consent-manager

      - name: Upload directory preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: uccm-wordpress-org-${{ steps.package.outputs.version }}
          path: |
            dist/wordpress-org/uk-cookie-consent-manager
            dist/wordpress-org/SOURCE-MANIFEST.sha256
            wordpress-org/assets
          if-no-files-found: error
          retention-days: 7
