name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-quality:
    name: Source quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        run: composer lint

      - name: Check browser script syntax
        run: |
          node --check assets/js/consent.js
          node --check assets/js/blocker.js
          node --check assets/js/admin-privacy.js
          node --check assets/js/scan-runner.js
          node --check playwright.config.js
          node --check tests/browser/admin-privacy.spec.js
          node --check tests/browser/consent.spec.js
          node --check tests/browser/scan-runner.spec.js

      - name: Check WordPress coding standards
        run: composer phpcs

      - name: Run static analysis
        run: composer phpstan

  unit-integration:
    name: Unit and integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit and integration tests
        run: composer test

  browser-consent:
    name: Browser consent (desktop and mobile)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser test tools
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install chromium webkit

      - name: Run consent and operational scanner browser flows
        run: npm run test:browser

  package-build:
    name: Package checks
    runs-on: ubuntu-latest
    needs:
      - source-quality
      - unit-integration
      - browser-consent

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        run: bash scripts/build-package.sh 0.1.0-ci

      - name: Verify clean archive and credential regression cases
        run: bash tests/package-verification.sh "dist/uk-cookie-consent-manager-0.1.0-ci.zip"

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: uccm-ci-package
          path: dist/uk-cookie-consent-manager-0.1.0-ci.zip
          if-no-files-found: error
          retention-days: 7

  package-install:
    name: Package install (WordPress ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs:
      - package-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: "6.8"
            php: "8.2"
          - wordpress: "6.8"
            php: "8.3"
          - wordpress: "6.9"
            php: "8.4"
          - wordpress: "7.0"
            php: "8.5"

    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: uccm-ci-package
          path: dist

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli
          tools: wp-cli

      - name: Install WordPress
        shell: bash
        run: |
          set -euo pipefail
          wp core download --version="${{ matrix.wordpress }}" --path="${RUNNER_TEMP}/wordpress" --force
          wp config create --path="${RUNNER_TEMP}/wordpress" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          wp core install --path="${RUNNER_TEMP}/wordpress" --url=https://example.test --title=UCCM --admin_user=admin --admin_password=test-password --admin_email=admin@example.test --skip-email

      - name: Install and activate packaged plugin
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/uk-cookie-consent-manager-0.1.0-ci.zip"
          expected_version="$(unzip -p "${archive}" uk-cookie-consent-manager/uk-cookie-consent-manager.php | sed -n 's/^ \* Version:[[:space:]]*//p')"
          test -n "${expected_version}"
          unzip -q "${archive}" -d "${RUNNER_TEMP}/wordpress/wp-content/plugins"
          wp plugin activate uk-cookie-consent-manager --path="${RUNNER_TEMP}/wordpress"
          wp plugin status uk-cookie-consent-manager --path="${RUNNER_TEMP}/wordpress"
          test "$(wp eval 'echo defined( "UCCM_VERSION" ) ? UCCM_VERSION : "";' --path="${RUNNER_TEMP}/wordpress")" = "${expected_version}"

      - name: Verify scheduled operating jobs
        shell: bash
        run: |
          set -euo pipefail
          wp cron event list --path="${RUNNER_TEMP}/wordpress" --fields=hook --format=csv > "${RUNNER_TEMP}/cron.csv"
          grep -q '^uccm_monthly_scan$' "${RUNNER_TEMP}/cron.csv"
          grep -q '^uccm_retention_cleanup$' "${RUNNER_TEMP}/cron.csv"
